name: main
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            # strip spaces, newlines, CR and quotes that break base64
            CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \n\r\t"'"'"'')
            if printf '%s' "$CLEAN" | base64 -d > "$GITHUB_WORKSPACE/release.jks" 2>/dev/null \
               && [ -s "$GITHUB_WORKSPACE/release.jks" ]; then
              echo "SIGNED=1" >> "$GITHUB_ENV"
            else
              rm -f "$GITHUB_WORKSPACE/release.jks"
              echo "::warning::KEYSTORE_BASE64 is not valid Base64. Falling back to an unsigned debug build."
            fi
          else
            echo "::warning::KEYSTORE_BASE64 is empty or missing. Building debug only."
          fi
      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle assembleRelease bundleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: handGAZA-apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
